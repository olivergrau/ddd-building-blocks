name: Stable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        default: 2.1.0

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and build Release configuration
        run: |
          dotnet restore DDD.BuildingBlocks.sln
          dotnet build DDD.BuildingBlocks.sln --no-restore --configuration Release

      - name: Run framework and provider verification
        run: |
          dotnet test test/DDD.BuildingBlocks.Core.Tests.Unit/DDD.BuildingBlocks.Core.Tests.Unit.csproj --no-build --configuration Release
          dotnet test test/DDD.BuildingBlocks.DevelopmentPackage.Tests.Integration/DDD.BuildingBlocks.DevelopmentPackage.Tests.Integration.csproj --no-build --configuration Release
          dotnet test test/DDD.BuildingBlocks.PostgreSQLPackage.Tests.Integration/DDD.BuildingBlocks.PostgreSQLPackage.Tests.Integration.csproj --no-build --configuration Release
          dotnet test test/DDD.BuildingBlocks.MSSQLPackage.Tests.Integration/DDD.BuildingBlocks.MSSQLPackage.Tests.Integration.csproj --no-build --configuration Release
          dotnet test example/RocketLaunch.Application.Tests/RocketLaunch.Application.Tests.csproj --no-build --configuration Release
          dotnet test example/RocketLaunch.ReadModel.Tests/RocketLaunch.ReadModel.Tests.csproj --no-build --configuration Release
          dotnet test example/RocketLaunch.Domain.Tests/RocketLaunch.Domain.Tests.csproj --no-build --configuration Release
          dotnet test example/LunarOps.Domain.Tests/LunarOps.Domain.Tests.csproj --no-build --configuration Release

      - name: Check dependencies for known vulnerabilities
        run: dotnet list DDD.BuildingBlocks.sln package --vulnerable --include-transitive

      - name: Create and inspect release bundle
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          version="${RELEASE_VERSION#v}"
          bash eng/create-release.sh "$version"

      - name: Verify clean consumer restore
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          version="${RELEASE_VERSION#v}"
          bash eng/consumer-smoke-test.sh "$version"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDD.BuildingBlocks-${{ env.RELEASE_TAG }}
          path: artifacts/release/${{ env.RELEASE_TAG }}/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "DDD.BuildingBlocks $version" \
            --notes-file "RELEASE_NOTES-$version.md" \
            --verify-tag \
            "artifacts/release/$GITHUB_REF_NAME"/packages/*.nupkg \
            "artifacts/release/$GITHUB_REF_NAME"/packages/*.snupkg \
            "artifacts/release/$GITHUB_REF_NAME/DDD.BuildingBlocks-$GITHUB_REF_NAME.tar.gz" \
            "artifacts/release/$GITHUB_REF_NAME/SHA256SUMS" \
            "artifacts/release/$GITHUB_REF_NAME/CHANGES.md" \
            "artifacts/release/$GITHUB_REF_NAME/MIGRATION-2.0.md" \
            "artifacts/release/$GITHUB_REF_NAME/LICENSE"
